<!DOCTYPE html>
<html lang="%LANGUAGE%">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>NexoWatt EOS · 404 - %TITLE%</title>
    <script>
        // Same theme as admin: the one chosen there, otherwise the one of the operating system.
        // In the head, so that the page is never painted in the wrong one first.
        (function () {
            var dark;
            try {
                var themeName = window.localStorage.getItem('App.themeName');
                if (themeName && themeName !== 'auto') {
                    // DARK_THEMES of gui-components (Utils.tsx)
                    dark = ['dark', 'blue', 'modernDark'].indexOf(themeName) !== -1;
                }
            } catch (e) {
                // no access to the local storage, e.g., in a sandboxed frame
            }
            if (dark === undefined) {
                dark = !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            }
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        })();
    </script>
    <style>
        /* Tokens of the "modern" themes of admin (gui-components ThemeModern.ts) */
        :root {
            --background: #F4F7FB;
            --paper: #FFFFFF;
            --border: #E2E8F0;
            --detail: #F4F7FB;
            --text-primary: #101827;
            --text-secondary: #5B6878;
            --gradient: linear-gradient(90deg, #2E93F9 0%, #0B76F5 100%);
            --gradient-hover: linear-gradient(90deg, #48A1FA 0%, #1B84F8 100%);
            --shadow: 0 2px 6px rgba(15, 23, 42, 0.04), 0 12px 32px rgba(15, 23, 42, 0.08);
        }

        [data-theme="dark"] {
            --background: #0A121D;
            --paper: #121A26;
            --border: #1B2533;
            --detail: #1A2434;
            --text-primary: #E8EDF5;
            --text-secondary: #8B97A8;
            --shadow: 0 2px 6px rgba(0, 0, 0, 0.24), 0 12px 32px rgba(0, 0, 0, 0.36);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: var(--background);
            color: var(--text-primary);
            font-family: "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            width: 100%;
            max-width: 480px;
            padding: 40px 32px 32px;
            text-align: center;
            background: var(--paper);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow);
        }

        .logo {
            width: 64px;
            height: 64px;
            padding: 6px;
            border-radius: 50%;
            /* The dark ring of the logo needs a light ground in the dark theme too */
            background: #FFFFFF;
            box-shadow: 0 0 0 1px var(--border);
        }

        .code {
            margin: 16px 0 4px;
            font-size: 72px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -2px;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 20px;
            font-weight: 600;
        }

        .message {
            margin: 0;
            font-size: 15px;
            line-height: 1.5;
            color: var(--text-secondary);
        }

        .detail {
            margin: 20px 0 0;
            padding: 10px 14px;
            font-size: 13px;
            line-height: 1.5;
            color: var(--text-secondary);
            background: var(--detail);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        .detail:empty {
            display: none;
        }

        .detail code {
            font-family: "JetBrains Mono", Consolas, "Courier New", monospace;
            color: var(--text-primary);
        }

        .back {
            display: inline-block;
            margin-top: 28px;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 600;
            color: #FFFFFF;
            text-decoration: none;
            background: var(--gradient);
            border-radius: 8px;
        }

        .back:hover {
            background: var(--gradient-hover);
        }

        .back:focus-visible {
            outline: 2px solid #4B9BFA;
            outline-offset: 2px;
        }
    </style>
</head>
