<!doctype html>
<html
    lang="de"
    translate="no"
    class="eos-native-shell"
>
    <head>
        <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
        <meta http-equiv="Pragma" content="no-cache" />
        <meta http-equiv="Expires" content="0" />
        <meta charset="utf-8" />
        <link
            rel="icon"
            href="favicon.ico"
        />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, user-scalable=no"
        />
        <meta
            name="theme-color"
            content="#020914"
        />
        <meta
            name="description"
            content="NexoWatt EOS - Energy Operation System"
        />
        <link
            rel="apple-touch-icon"
            href="logo192.png"
        />
        <link
            rel="stylesheet"
            href="css/leaflet.css"
        />
        <link rel="stylesheet" href="css/nexowatt-native-shell.css?v=89" />
        <link
            rel="manifest"
            href="manifest.json"
            crossorigin="use-credentials"
        />
        <script src="js/eos-manual-write-policy.js?v=89"></script>
        <script>
            const script = document.createElement('script');

            window.registerSocketOnLoad = function (cb) {
                window.socketLoadedHandler = cb;
            };

            script.onload = function () {
                typeof window.socketLoadedHandler === 'function' && window.socketLoadedHandler();
            };

            script.onerror = function () {
                console.error('Cannot load socket.io. Retry in 5 seconds');
                setTimeout(function () {
                    window.location.reload();
                }, 5000);
            };

            setTimeout(() => {
                script.src =
                    window.location.port === '3000'
                        ? `${window.location.protocol}//${window.location.hostname}:8081/lib/js/socket.io.js`
                        : './lib/js/socket.io.js';
            }, 1000);

            document.head.appendChild(script);
        </script>
        <script
            type="text/javascript"
            src="./lib/js/sparkline.js"
        ></script>
        <title>NexoWatt EOS - Energy Operation System</title>

        <script>
            window.loginHideLogo = '@@loginHideLogo@@';
            window.loginMotto = 'Energy Operation System';
            window.login = '@@auth@@';
            window.loginLogo = '@@loginLogo@@';
            window.loginLink = '@@loginLink@@';
            window.loginTitle = 'NexoWatt EOS';
            window.loginBackgroundColor = '@@loginBackgroundColor@@';
            window.loginBackgroundImage = '@@loginBackgroundImage@@';

            window.vendorPrefix = '@@vendorPrefix@@';
            window.disableDataReporting = '@@disableDataReporting@@';

            window.loadingBackgroundColor = '@@loadingBackgroundColor@@';
            window.loadingBackgroundImage = '@@loadingBackgroundImage@@';
            window.loadingHideLogo = '@@loadingHideLogo@@';
            window.ssoActive = '@@ssoActive@@';

            // NexoWatt EOS branding: keep login page independent from old Admin/login settings.
            window.loginTitle = 'NexoWatt EOS';
            window.loginMotto = 'Energy Operation System';
            window.loginLogo = 'img/eos/nexowatt-192.png';
            window.loginLink = '#';
            window.loginHideLogo = 'false';
            window.loginBackgroundColor = '#020914';
            window.loadingBackgroundColor = '#020914';
        </script>
        <style>
            .root {
                background-color: rgba(255, 255, 255, 0.87);
                border-radius: 10px;
            }
            .unsupported {
                width: 200px;
                background-color: #aaaaaa;
                margin: auto;
                margin-top: 3rem;
                padding: 10px;
                line-height: 25px;
                border-radius: 4px;
                text-align: center;
            }
            .leaflet-container {
                height: 400px;
                width: 100%;
            }
        </style>
        <script>
            setTimeout(() => {
                const body = document.body;
                if (window.location.search.includes('?login')) {
                    if (window.vendorPrefix === 'HA') {
                        body.style.backgroundColor = '#000000';
                    } else if (
                        window.loginBackgroundColor &&
                        !window.loginBackgroundColor.includes('loginBackgroundColor')
                    ) {
                        // apply image and background color to the whole page as fast as possible
                        body.style.backgroundColor = window.loginBackgroundColor;
                    }
                    if (window.loginBackgroundImage && !window.loginBackgroundImage.includes('loginBackgroundImage')) {
                        body.style.backgroundImage = `url(${window.loginBackgroundImage})`;
                        body.style.backgroundSize = 'cover';
                    }
                } else {
                    if (window.vendorPrefix === 'HA') {
                        body.style.backgroundColor = '#000000';
                    } else if (
                        window.loadingBackgroundColor &&
                        !window.loadingBackgroundColor.includes('loadingBackgroundColor')
                    ) {
                        // apply image and background color to the whole page as fast as possible
                        body.style.backgroundColor = window.loadingBackgroundColor;
                    }
                    if (
                        window.loadingBackgroundImage &&
                        !window.loadingBackgroundImage.includes('loadingBackgroundImage')
                    ) {
                        body.style.backgroundImage = `url(${window.loadingBackgroundImage})`;
                        body.style.backgroundSize = 'cover';
                    }
                }
            }, 0);

            window.addEventListener(
                'load',
                function load(event) {
                    window.removeEventListener('load', load, false);

                    const isMsie = function () {
                        const ua = window.navigator.userAgent;
                        const msie = ua.indexOf('MSIE ');

                        return msie > 0 || !!navigator.userAgent.match(/Trident.*rv\:11\./);
                    };

                    if (isMsie()) {
                        const root = document.getElementById('root');

                        root.classList.add('unsupported');

                        root.innerHTML = 'Browser is not supported. Please use Firefox or Chrome for NexoWatt EOS.';
                    }
                },
                false,
            );
        </script>
    <!-- NEXOWATT_STABLE_LOGIN_V94 -->
<style>
/* NexoWatt EOS 7.9.94 stable login and dormant-assistant guard */
html.nw-eos-login, html.nw-eos-login body, body.nw-eos-login { min-height: 100%; overflow-y: auto !important; }
.nw-eos-login-shell { width: min(430px, calc(100vw - 28px)) !important; min-height: 545px !important; height: auto !important; max-height: none !important; overflow: visible !important; box-sizing: border-box !important; padding: 22px !important; }
.nw-eos-login-card { width: 100% !important; min-height: 485px !important; height: auto !important; max-height: none !important; overflow: visible !important; box-sizing: border-box !important; padding: 28px 28px 24px !important; }
.nw-eos-login-form { height: auto !important; max-height: none !important; overflow: visible !important; }
.nw-eos-login-card [role="alert"] { margin-bottom: 12px !important; max-height: none !important; overflow: visible !important; }
.nw-eos-login-card button[type="submit"] { min-height: 42px !important; }
[data-nexowatt-eos-assist], .nexowatt-eos-assist, .eos-assist-button, .eos-assist-panel { display: none !important; visibility: hidden !important; pointer-events: none !important; }
@media (max-height: 620px) { .nw-eos-login-shell { min-height: 510px !important; margin: 20px auto !important; } .nw-eos-login-card { min-height: 455px !important; } }

</style>
<script>
(() => {
  'use strict';
  const LOGIN_RE = /(?:\?|#|\/)login(?:[=&/]|$)/i;
  const isLogin = () => LOGIN_RE.test(location.href) || !!document.querySelector('input[type="password"]');
  const hideAssist = () => {
    document.querySelectorAll('button,a,[role="button"],div,span').forEach(el => {
      const txt=(el.textContent||'').trim();
      if (txt === 'EOS Assist' || txt.startsWith('EOS Assist\n') || txt.includes('EOS Assist muss einmalig konfiguriert')) {
        const target=el.closest('button,a,[role="button"],aside,dialog') || el;
        target.setAttribute('data-nexowatt-eos-assist','disabled');
        target.style.setProperty('display','none','important');
      }
    });
  };
  const applyLogin = () => {
    if (!isLogin()) return;
    document.documentElement.classList.add('nw-eos-login');
    document.body?.classList.add('nw-eos-login');
    const pwd=document.querySelector('input[type="password"]');
    if (!pwd) return;
    const form=pwd.closest('form') || pwd.parentElement?.parentElement;
    if (!form) return;
    form.classList.add('nw-eos-login-form');
    let card=form.parentElement;
    if (card) card.classList.add('nw-eos-login-card');
    let shell=card?.parentElement;
    if (shell) shell.classList.add('nw-eos-login-shell');
    // Clear historical inner scroll settings without disabling page scroll on very small screens.
    [form,card,shell].filter(Boolean).forEach(el => {
      el.style.setProperty('overflow-y','visible','important');
      el.style.setProperty('max-height','none','important');
      el.style.setProperty('height','auto','important');
    });
    // Remove the discontinued passwordless activation controls and wording.
    document.querySelectorAll('button,a,[role="button"],div').forEach(el => {
      const txt=(el.textContent||'').trim();
      if (/Erstanmeldung ohne Passwort|passwordless first/i.test(txt)) {
        const target=el.closest('button,a,[role="button"]') || el;
        target.style.setProperty('display','none','important');
      }
    });
  };
  const run=()=>{hideAssist();applyLogin();};
  new MutationObserver(run).observe(document.documentElement,{childList:true,subtree:true,attributes:false});
  addEventListener('DOMContentLoaded',run,{once:true});
  addEventListener('load',run,{once:true});
  setInterval(run,1500);
})();

</script>
</head>
    <body>
        <noscript>Für NexoWatt EOS muss JavaScript aktiviert sein.</noscript>
        <div id="root"></div>
        <script defer src="js/eos-role-bootstrap.js?v=89" data-eos-entry="src/index.tsx"></script>
        <script defer src="js/eos-policy-client.js?v=89"></script>
        <script defer src="js/eos-branding-sanitizer.js?v=89"></script>
        <script defer src="js/nexowatt-native-shell.js?v=89"></script>
        <script defer src="js/eos-native-security.js?v=89"></script>
        <script defer src="js/eos-basic-settings.js?v=89"></script>
        <script defer src="js/eos-role-ui.js?v=89"></script>
        <script defer src="js/eos-account-management.js?v=89"></script>
        <script defer src="js/eos-assistant.js?v=89"></script>
</body>
</html>
